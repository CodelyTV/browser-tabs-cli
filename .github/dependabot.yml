# yaml-language-server: $schema=https://json.schemastore.org/dependabot-2.0.json

version: 2
updates:
  - package-ecosystem: "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"
    open-pull-requests-limit: 5
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Madrid"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"

  # Dependabot uses the npm ecosystem for pnpm manifests and lockfiles.
  - package-ecosystem: "npm"
    commit-message:
      prefix: "fix"
      prefix-development: "build"
      include: "scope"
    open-pull-requests-limit: 5
    directory: "/"
    versioning-strategy: "increase"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Madrid"
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 7
    ignore:
      # Keep Node types aligned with the minimum supported Node version.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

      # v10 requires conventional-changelog-writer >=9, while the semantic-release
      # plugins we use still depend on writer ^8. Remove this ignore once both
      # packages below use conventional-changelog-writer >=9, then verify that
      # tests/release.test.mjs passes with the v10 preset:
      # https://github.com/semantic-release/release-notes-generator/blob/master/package.json
      # https://github.com/semantic-release/commit-analyzer/blob/master/package.json
      - dependency-name: "conventional-changelog-conventionalcommits"
        versions: ["10.x"]
    groups:
      development-minor-patch:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      production-minor-patch:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      # Major updates remain separate PRs.
