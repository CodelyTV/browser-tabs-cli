# yaml-language-server: $schema=https://json.schemastore.org/dependabot-2.0.json

version: 2
updates:
  - package-ecosystem: "github-actions"
    open-pull-requests-limit: 5
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Madrid"
    # Add CodelyTV/dev as reviewers when the team has access to this repository.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"

  # Dependabot uses the npm ecosystem for pnpm manifests and lockfiles.
  - package-ecosystem: "npm"
    open-pull-requests-limit: 5
    directory: "/"
    versioning-strategy: "increase"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Madrid"
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 7
    ignore:
      # Keep Node types aligned with the minimum supported Node version.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      development-minor-patch:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      production-minor-patch:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      # Major updates remain separate PRs.
